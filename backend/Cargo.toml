[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
rand = "0.10"
anyhow = "1"
wasmtime = "51.0.0-rc.1"
ts-rs = "12.0.1"
glam = "0.34"
hecs = "0.11"
